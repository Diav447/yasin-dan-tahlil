name: Build APK Yasin
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        
      - name: Build APK
        run: |
          chmod +x gradlew || (gradle wrapper --gradle-version 8.0 && chmod +x gradlew)
          ./gradlew assembleDebug --stacktrace
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-Yasin-Offline-No-Internet
          path: app/build/outputs/apk/debug/*.apk
